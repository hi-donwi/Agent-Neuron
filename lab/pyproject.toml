[project]
name = "neuron-lab"
version = "0.0.0"
description = "DONWI Neuron lab: builds, trains, and evaluates neurons. Serving them needs no Python."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

# `dev` is what `make lab-check` and CI install. `spikes` holds what the N0 spikes under
# spikes/ need on top of it (`uv sync --locked --group spikes`); CI does not install it.
# Machine-learning dependencies arrive with the milestone that needs them, each one
# pinned by uv.lock.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
spikes = [
    "model2vec>=0.10.0",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
