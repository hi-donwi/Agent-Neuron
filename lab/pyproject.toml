[project]
name = "neuron-lab"
version = "0.0.0"
description = "Agent-Neuron lab: builds, trains, and evaluates neurons. Serving them needs no Python."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

# Development tools only. Machine-learning dependencies arrive with the milestone
# that needs them, each one pinned by uv.lock.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
